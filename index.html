<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خمّن الرقم - أونلاين</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --accent:#22c55e; --accent2:#f59e0b;
    --text:#f1f5f9; --muted:#94a3b8; --danger:#ef4444; --blue:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:linear-gradient(160deg,#0f172a,#1e293b);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card); border-radius:20px; padding:28px 24px;
    width:100%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.4);
    text-align:center;
  }
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:20px;}
  .turn-badge{
    display:inline-block; padding:6px 16px; border-radius:999px;
    font-weight:bold; font-size:14px; margin-bottom:16px;
  }
  .turn-me{background:rgba(34,197,94,0.2); color:#4ade80;}
  .turn-opp{background:rgba(245,158,11,0.2); color:#fbbf24;}
  input[type=text], input[type=number]{
    width:100%; padding:14px; font-size:20px; text-align:center;
    border-radius:12px; border:2px solid #334155; background:#0f172a;
    color:var(--text); margin-bottom:12px;
  }
  input:focus{outline:none; border-color:var(--accent);}
  button{
    width:100%; padding:14px; font-size:16px; font-weight:bold;
    border:none; border-radius:12px; cursor:pointer; margin-top:6px;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .btn-main{background:var(--accent); color:#052e16;}
  .btn-secondary{background:#334155; color:var(--text);}
  .code-box{
    font-size:32px; font-weight:bold; letter-spacing:6px; background:#0f172a;
    border:2px dashed var(--accent); border-radius:12px; padding:14px; margin:16px 0;
  }
  .feedback{font-size:18px; font-weight:bold; min-height:28px; margin:14px 0;}
  .fb-high{color:var(--accent2);}
  .fb-low{color:var(--blue);}
  .fb-win{color:var(--accent); font-size:20px;}
  .attempts{color:var(--muted); font-size:14px; margin-bottom:4px;}
  .history{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0; min-height:32px;}
  .chip{background:#0f172a; border:1px solid #334155; border-radius:8px; padding:4px 10px; font-size:14px;}
  .chip.up{border-color:var(--accent2); color:var(--accent2);}
  .chip.down{border-color:var(--blue); color:var(--blue);}
  .scoreboard{display:flex; justify-content:space-between; background:#0f172a; border-radius:12px; padding:10px 16px; margin-bottom:18px; font-size:14px;}
  .score-item span{display:block; font-size:20px; font-weight:bold;}
  .hidden{display:none;}
  .error{color:var(--danger); font-size:13px; min-height:18px; margin-bottom:4px;}
  .status{color:var(--muted); font-size:13px; margin-top:10px;}
  .tabs{display:flex; gap:8px; margin-bottom:18px;}
  .tab{flex:1; padding:10px; border-radius:10px; background:#0f172a; border:2px solid #334155; cursor:pointer; font-weight:bold;}
  .tab.active{border-color:var(--accent); color:var(--accent);}
  .spinner{
    width:28px; height:28px; border:3px solid #334155; border-top-color:var(--accent);
    border-radius:50%; margin:16px auto; animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .waiting-line{color:var(--muted); font-size:15px; margin:20px 0;}
</style>
</head>
<body>
<div class="card" id="app">

  <!-- SCREEN 1: connect (create / join) -->
  <div id="connectScreen">
    <h1>🎯 خمّن الرقم</h1>
    <div class="sub">العب مع صديقك من أي دولة — أونلاين مباشرة</div>
    <div class="tabs">
      <div class="tab active" id="tabCreate" onclick="switchTab('create')">أنشئ غرفة</div>
      <div class="tab" id="tabJoin" onclick="switchTab('join')">انضم لغرفة</div>
    </div>

    <div id="createBox">
      <button class="btn-main" onclick="createRoom()">أنشئ غرفة جديدة</button>
    </div>

    <div id="joinBox" class="hidden">
      <input type="text" id="joinCode" placeholder="أدخل كود الغرفة" maxlength="4" style="text-transform:uppercase">
      <button class="btn-main" onclick="joinRoom()">انضم</button>
    </div>
    <div class="error" id="connectError"></div>
    <div class="status" id="connectStatus"></div>
  </div>

  <!-- SCREEN 2: waiting for opponent to join -->
  <div id="waitScreen" class="hidden">
    <h1>غرفتك جاهزة</h1>
    <div class="sub">أرسل هذا الكود لصديقك ليدخل به من هاتفه</div>
    <div class="code-box" id="roomCodeDisplay"></div>
    <div class="spinner"></div>
    <div class="waiting-line">بانتظار انضمام صديقك...</div>
  </div>

  <!-- SCREEN 3: enter name + secret -->
  <div id="setupScreen" class="hidden">
    <h1>👋 جاهزون للعب</h1>
    <div class="sub">أدخل اسمك واختر رقمك السري (١-١٠٠) — لن يراه خصمك</div>
    <input type="text" id="myName" placeholder="اسمك" maxlength="12">
    <input type="number" id="mySecret" placeholder="رقمك السري" min="1" max="100">
    <div class="error" id="setupError"></div>
    <button class="btn-main" onclick="confirmSetup()">جاهز!</button>
    <div class="status" id="setupStatus"></div>
  </div>

  <!-- SCREEN 4: game -->
  <div id="guessScreen" class="hidden">
    <div class="turn-badge" id="turnBadge"></div>
    <div class="scoreboard">
      <div class="score-item" id="scoreMe"></div>
      <div class="score-item" id="scoreOpp"></div>
    </div>
    <div class="attempts" id="attemptsText"></div>

    <div id="myTurnBox">
      <input type="number" id="guessInput" placeholder="خمّن رقمًا" min="1" max="100">
      <button class="btn-main" onclick="submitGuess()">خمّن</button>
    </div>
    <div id="oppTurnBox" class="hidden waiting-line">بانتظار تخمين الخصم...</div>

    <div class="feedback" id="feedback"></div>
    <div class="history" id="history"></div>
  </div>

  <!-- SCREEN 5: end -->
  <div id="endScreen" class="hidden">
    <h1>🏆 انتهت اللعبة</h1>
    <div class="feedback fb-win" id="endResult"></div>
    <button class="btn-main" onclick="location.reload()">العب مرة أخرى</button>
  </div>

</div>

<script>
let S = {
  role: null,        // 'host' | 'joiner'
  peer: null,
  conn: null,
  myName: '', oppName: '',
  mySecret: null,
  myAttempts: 0, oppAttempts: 0,
  round: 1,           // 1 or 2
  myReady: false, oppReady: false,
  gameStarted: false
};

function switchTab(which){
  document.getElementById('tabCreate').classList.toggle('active', which==='create');
  document.getElementById('tabJoin').classList.toggle('active', which==='join');
  document.getElementById('createBox').classList.toggle('hidden', which!=='create');
  document.getElementById('joinBox').classList.toggle('hidden', which!=='join');
  document.getElementById('connectError').textContent='';
}

function randomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='';
  for(let i=0;i<4;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

function createRoom(){
  document.getElementById('connectError').textContent='';
  document.getElementById('connectStatus').textContent='جارٍ إنشاء الغرفة...';
  const code = randomCode();
  S.role = 'host';
  S.peer = new Peer('guessnum-' + code, { debug: 0 });

  S.peer.on('open', function(){
    document.getElementById('roomCodeDisplay').textContent = code;
    document.getElementById('connectScreen').classList.add('hidden');
    document.getElementById('waitScreen').classList.remove('hidden');
  });

  S.peer.on('connection', function(conn){
    S.conn = conn;
    setupConnHandlers();
  });

  S.peer.on('error', function(err){
    document.getElementById('connectStatus').textContent='';
    document.getElementById('connectError').textContent = 'حدث خطأ، حاول من جديد: ' + err.type;
  });
}

function joinRoom(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  document.getElementById('connectError').textContent='';
  if(!code || code.length<4){
    document.getElementById('connectError').textContent='أدخل كود الغرفة المكوّن من ٤ رموز';
    return;
  }
  document.getElementById('connectStatus').textContent='جارٍ الاتصال...';
  S.role = 'joiner';
  S.peer = new Peer({ debug: 0 });

  S.peer.on('open', function(){
    const conn = S.peer.connect('guessnum-' + code, { reliable: true });
    S.conn = conn;
    setupConnHandlers();
  });

  S.peer.on('error', function(err){
    document.getElementById('connectStatus').textContent='';
    if(err.type === 'peer-unavailable'){
      document.getElementById('connectError').textContent='لم يتم العثور على غرفة بهذا الكود';
    } else {
      document.getElementById('connectError').textContent = 'حدث خطأ: ' + err.type;
    }
  });
}

function setupConnHandlers(){
  S.conn.on('open', function(){
    document.getElementById('waitScreen').classList.add('hidden');
    document.getElementById('connectScreen').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
  });
  S.conn.on('data', handleMessage);
  S.conn.on('close', function(){
    document.getElementById('setupStatus').textContent = 'انقطع الاتصال بالخصم';
  });
}

function send(msg){
  if(S.conn && S.conn.open) S.conn.send(msg);
}

function confirmSetup(){
  const name = document.getElementById('myName').value.trim() || 'أنا';
  const secret = parseInt(document.getElementById('mySecret').value);
  if(!secret || secret<1 || secret>100){
    document.getElementById('setupError').textContent = 'أدخل رقمًا صحيحًا بين ١ و١٠٠';
    return;
  }
  S.myName = name;
  S.mySecret = secret;
  S.myReady = true;
  send({t:'ready', name:name});
  document.getElementById('setupScreen').querySelectorAll('input,button').forEach(el=>el.disabled=true);
  document.getElementById('setupStatus').textContent = S.oppReady ? '' : 'بانتظار جهوزية الخصم...';
  tryStartGame();
}

function tryStartGame(){
  if(S.myReady && S.oppReady && !S.gameStarted){
    S.gameStarted = true;
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('guessScreen').classList.remove('hidden');
    renderGuessScreen();
  }
}

function isMyTurn(){
  return (S.round===1 && S.role==='host') || (S.round===2 && S.role==='joiner');
}

function renderGuessScreen(){
  const myTurn = isMyTurn();
  document.getElementById('turnBadge').textContent = myTurn
    ? `دورك — خمّن رقم ${S.oppName}`
    : `دور ${S.oppName} — ينتظر أن يخمّن رقمك`;
  document.getElementById('turnBadge').className = 'turn-badge ' + (myTurn?'turn-me':'turn-opp');
  document.getElementById('myTurnBox').classList.toggle('hidden', !myTurn);
  document.getElementById('oppTurnBox').classList.toggle('hidden', myTurn);
  const myAttemptsShown = S.round===1 ? (S.role==='host'?S.myAttempts:S.oppAttempts)
                                       : (S.role==='joiner'?S.myAttempts:S.oppAttempts);
  document.getElementById('attemptsText').textContent = `محاولات هذه الجولة: ${myTurn?S.myAttempts:S.oppAttempts}`;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('guessInput').value='';
  updateScoreboard();
}

function updateScoreboard(){
  document.getElementById('scoreMe').innerHTML = `${S.myName}<span>${S.myAttempts||'-'}</span>`;
  document.getElementById('scoreOpp').innerHTML = `${S.oppName}<span>${S.oppAttempts||'-'}</span>`;
}

function addHistoryChip(val, dir){
  const h = document.getElementById('history');
  const chip = document.createElement('div');
  chip.className = 'chip ' + (dir==='up'?'up':dir==='down'?'down':'');
  chip.textContent = dir==='up' ? `${val} ↑` : dir==='down' ? `${val} ↓` : `${val} ✓`;
  h.appendChild(chip);
}

function submitGuess(){
  if(!isMyTurn()) return;
  const val = parseInt(document.getElementById('guessInput').value);
  if(!val || val<1 || val>100) return;
  send({t:'guess', v: val});
  document.getElementById('guessInput').value='';
  document.getElementById('guessInput').disabled = true;
  document.getElementById('feedback').textContent = 'بانتظار رد الخصم...';
}

function handleMessage(msg){
  if(msg.t === 'ready'){
    S.oppReady = true;
    S.oppName = msg.name;
    document.getElementById('setupStatus').textContent = S.myReady ? '' : `${S.oppName} جاهز، أكمل إعدادك`;
    tryStartGame();
  }
  else if(msg.t === 'guess'){
    // I'm the setter this round, opponent guessed my number
    S.oppAttempts++;
    let dir;
    if(msg.v === S.mySecret) dir = 'correct';
    else if(msg.v < S.mySecret) dir = 'up';
    else dir = 'down';
    send({t:'feedback', v: msg.v, dir: dir});
    // reflect on my screen too (I'm the spectator/setter this round)
    document.getElementById('history').classList.contains('__unused__'); // no-op
    if(!isMyTurn()){
      addHistoryChip(msg.v, dir);
      document.getElementById('attemptsText').textContent = `محاولات هذه الجولة: ${S.oppAttempts}`;
      updateScoreboard();
      if(dir === 'correct'){
        setTimeout(endRoundAndAdvance, 1200);
      }
    }
  }
  else if(msg.t === 'feedback'){
    // I'm the guesser
    S.myAttempts++;
    document.getElementById('guessInput').disabled = false;
    addHistoryChip(msg.v, msg.dir);
    updateScoreboard();
    const fb = document.getElementById('feedback');
    if(msg.dir === 'correct'){
      fb.textContent = `🎉 صحيح! الرقم كان ${msg.v} — بعدد ${S.myAttempts} محاولة`;
      fb.className = 'feedback fb-win';
      document.getElementById('myTurnBox').classList.add('hidden');
      setTimeout(endRoundAndAdvance, 1200);
    } else if(msg.dir === 'up'){
      fb.textContent = 'أعلى ⬆️';
      fb.className = 'feedback fb-high';
      document.getElementById('attemptsText').textContent = `محاولات هذه الجولة: ${S.myAttempts}`;
    } else {
      fb.textContent = 'أقل ⬇️';
      fb.className = 'feedback fb-low';
      document.getElementById('attemptsText').textContent = `محاولات هذه الجولة: ${S.myAttempts}`;
    }
  }
  else if(msg.t === 'roundadvance'){
    advanceRound();
  }
}

function endRoundAndAdvance(){
  send({t:'roundadvance'});
  advanceRound();
}

let _advanced = false;
function advanceRound(){
  if(S.round === 1){
    S.round = 2;
    document.getElementById('history').innerHTML='';
    renderGuessScreen();
  } else {
    showEnd();
  }
}

function showEnd(){
  document.getElementById('guessScreen').classList.add('hidden');
  const meA = S.myAttempts, oppA = S.oppAttempts;
  let msg;
  if(meA < oppA) msg = `🏆 ${S.myName} يفوز! (${meA} محاولة مقابل ${oppA})`;
  else if(oppA < meA) msg = `🏆 ${S.oppName} يفوز! (${oppA} محاولة مقابل ${meA})`;
  else msg = `🤝 تعادل! كلاكما استخدم ${meA} محاولة`;
  document.getElementById('endResult').textContent = msg;
  document.getElementById('endScreen').classList.remove('hidden');
}

document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(!document.getElementById('joinBox').classList.contains('hidden')) joinRoom();
  else if(!document.getElementById('setupScreen').classList.contains('hidden')) confirmSetup();
  else if(!document.getElementById('guessScreen').classList.contains('hidden') && isMyTurn()) submitGuess();
});
</script>
</body>
</html>
